[project]
name = "attackbed-cli"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["PyYAML>=6,<7", "openstacksdk>=2,<5"]

[project.scripts]
attackbed = "attackbed.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["scripts"]
include = ["attackbed*"]
